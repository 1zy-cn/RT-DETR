  # Ultralytics YOLO 🚀, AGPL-3.0 license
  # SVRDD ablation: SCSA backbone + HSFPN neck + P2-to-P3 detail path, without DySample.

  # Parameters
  nc: 7  # SVRDD classes
  scales: # model compound scaling constants, i.e. 'model=yolov8n-cls.yaml' will call yolov8-cls.yaml with scale 'n'
    # [depth, width, max_channels]
    l: [1.00, 1.00, 1024]

  backbone:
    # [from, repeats, module, args]
    - [-1, 1, ConvNormLayer, [32, 3, 2, 1, 'relu']] # 0-P1
    - [-1, 1, ConvNormLayer, [32, 3, 1, 1, 'relu']] # 1
    - [-1, 1, ConvNormLayer, [64, 3, 1, 1, 'relu']] # 2
    - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2

    # Blocks args: [channels, block, stage, att]. Enable SCSA in all 8 residual blocks.
    - [-1, 2, Blocks, [64,  BasicBlock_SCSA, 2, True]] # 4
    - [-1, 2, Blocks, [128, BasicBlock_SCSA, 3, True]] # 5-P3
    - [-1, 2, Blocks, [256, BasicBlock_SCSA, 4, True]] # 6-P4
    - [-1, 2, Blocks, [512, BasicBlock_SCSA, 5, True]] # 7-P5

  head:
    - [-1, 1, GSConv, [256, 1, 1, None, 1, 1, True]]  # 8: current GSConv uses SiLU internally
    - [-1, 1, AIFI, [1024, 8]]
    - [-1, 1, CA, []] # 10
    - [-1, 1, nn.Conv2d, [256, 1]] # 11
    - [-1, 3, RepC3, [256, 0.5]] # 12 P5

    - [6, 1, CA, []]
    - [-1, 1, nn.Conv2d, [256, 1]]  # 14

    - [11, 1, nn.ConvTranspose2d, [256, 3, 2, 1, 1]] # 15 P5 to P4
    - [-1, 1, CA, [4, False]]
    - [[-1, 14], 1, multiply, []] # 17
    - [[-1, 15], 1, Add, []] # 18
    - [-1, 3, RepC3, [256, 0.5]] # 19 P4

    - [5, 1, CA, []] # 20
    - [-1, 1, nn.Conv2d, [256, 1]] # 21

    - [15, 1, nn.ConvTranspose2d, [256, 3, 2, 1, 1]] # 22 P4 to P3; keep the HSFPN source route
    - [-1, 1, CA, [4, False]] # 23
    - [[-1, 21], 1, multiply, []] # 24
    - [[-1, 22], 1, Add, []] # 25
    - [-1, 3, RepC3, [256, 0.5]] # 26 P3

    - [26, 1, nn.Upsample, [None, 2, 'nearest']] # 27 P3 to P2
    - [27, 1, Conv, [128, 1, 1]] # 28 lightweight P2 semantic stream
    - [4, 1, nn.Conv2d, [128, 1]] # 29 P2 lateral projection
    - [28, 1, CA, [4, False]] # 30 semantic gate for P2
    - [[-1, 29], 1, multiply, []] # 31 gated P2 detail
    - [[-1, 28], 1, Add, []] # 32 P2 fusion
    - [-1, 3, RepC3, [128, 0.5]] # 33 enhanced P2
    - [-1, 1, Conv, [256, 3, 2]] # 34 P2 to P3 bottom-up
    - [[-1, 26], 1, Concat, [1]] # 35 detail plus original HSFPN P3
    - [-1, 3, RepC3, [256, 0.5]] # 36 enhanced P3
    - [[36, 19, 12], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]] # P3/P4/P5
