# Ultralytics RT-DETR-ResNet18 Improved for RDD2022
# 创新点：ResNet18 + AKConv(形态感知) + HSFPN(高频增强) + SCSA(序列注意力)

# Parameters
nc: 8  # RDD2022 类别数 (D00, D10, D20, D40等)
scales:
  # [depth, width, max_channels]
  l: [1.00, 1.00, 1024]

# 1. Backbone: ResNet18 with AKConv
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [64, 3, 1]]  # 1
  - [-1, 1, Conv, [128, 3, 2]] # 2-P2/4
  - [-1, 2, ResNetLayer, [128, 128, 1, 1]] # 3
  - [-1, 1, Conv, [256, 3, 2]] # 4-P3/8
  - [-1, 2, ResNetLayer, [256, 256, 1, 1]] # 5
  - [-1, 1, Conv, [512, 3, 2]] # 6-P4/16

  # 修正 AKConv 传参：[outc, k, num_param] -> [512, 3, 9]
  # num_param=9 对应 3x3 卷积核的自适应采样点
  - [-1, 1, AKConv, [512, 3, 9]]   # 7-P4 几何特征增强

  - [-1, 1, Conv, [1024, 3, 2]] # 8-P5/32
  - [-1, 1, AKConv, [1024, 3, 9]]  # 9-P5 全局上下文形态捕捉

# 2. Neck: HSFPN + SCSA (针对细长、高频裂缝特征)
head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 10 input P5
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]    # 11
  - [7, 1, Conv, [256, 1, 1, None, 1, 1, False]]   # 12 input P4

  # 使用你项目中的 HSFPN 模块进行高频特征对齐
  - [[11, 12], 1, HSFPN, [256]]                    # 13
  # 在融合后的特征图上使用 SCSA 进一步通过序列注意力抑制背景噪声
  - [-1, 1, SCSA, [256]]                           # 14

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]    # 15
  - [5, 1, Conv, [256, 1, 1, None, 1, 1, False]]   # 16 input P3
  - [[15, 16], 1, HSFPN, [256]]                    # 17
  - [-1, 1, SCSA, [256]]                           # 18

  - [-1, 1, Conv, [256, 3, 2]]                     # 19 downsample to P4
  - [[19, 13], 1, Concat, [1]]                     # 20
  - [-1, 3, Conv, [256, 3, 1]]                     # 21

  - [-1, 1, Conv, [256, 3, 2]]                     # 22 downsample to P5
  - [[22, 10], 1, Concat, [1]]                     # 23
  - [-1, 3, Conv, [256, 3, 1]]                     # 24

  # 3. RT-DETR 特有的 Transformer Decoder
  # AIFI 默认在最后一层特征图进行自注意力，这里我们传入改进后的多尺度特征
  - [[18, 21, 24], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]] # 25-检测头