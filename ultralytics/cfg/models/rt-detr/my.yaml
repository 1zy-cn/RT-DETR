# Ultralytics RT-DETR-ResNet18 Improved for RDD2022
# 创新方案：ResNet18(Backbone) + AKConv(形态感知) + HSFPN(高频增强) + SCSA(序列注意力)

# Parameters
nc: 8  # RDD2022 类别数
scales:
  # [depth, width, max_channels]
  l: [1.00, 1.00, 1024]

# 1. Backbone: ResNet18 with AKConv
# 修正 AKConv 传参：[outc, num_param, stride]
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [64, 3, 1]]  # 1
  - [-1, 1, Conv, [128, 3, 2]] # 2-P2/4
  - [-1, 2, ResNetLayer, [128, 128, 1, 1]] # 3
  - [-1, 1, Conv, [256, 3, 2]] # 4-P3/8
  - [-1, 2, ResNetLayer, [256, 256, 1, 1]] # 5
  - [-1, 1, Conv, [512, 3, 2]] # 6-P4/16

  # 修正：第一个512是outc, 9是num_param (3x3采样点), 1是stride
  - [-1, 1, AKConv, [512, 9, 1]]   # 7-P4 特征增强

  - [-1, 1, Conv, [1024, 3, 2]] # 8-P5/32
  - [-1, 1, AKConv, [1024, 9, 1]]  # 9-P5 形态捕捉

# 2. Neck: HSFPN + SCSA
head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 10 input P5
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]    # 11
  - [7, 1, Conv, [256, 1, 1, None, 1, 1, False]]   # 12 input P4

  # 这里的 HSFPN 建议配合你代码中的融合逻辑
  - [[11, 12], 1, Concat, [1]]  # 13: 此时通道合并为 512
  - [-1, 1, HSFPN, [256]]       # 14: 此时 HSFPN 只接收一个输入

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]    # 15
  - [5, 1, Conv, [256, 1, 1, None, 1, 1, False]]   # 16 input P3
  - [[15, 16], 1, HSFPN, [256]]                    # 17
  - [-1, 1, SCSA, [256]]                           # 18

  - [-1, 1, Conv, [256, 3, 2]]                     # 19 downsample to P4
  - [[19, 13], 1, Concat, [1]]                     # 20
  - [-1, 3, Conv, [256, 3, 1]]                     # 21

  - [-1, 1, Conv, [256, 3, 2]]                     # 22 downsample to P5
  - [[22, 10], 1, Concat, [1]]                     # 23
  - [-1, 3, Conv, [256, 3, 1]]                     # 24

  # 3. RT-DETR Transformer Decoder
  - [[18, 21, 24], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]] # 25-Detect Head