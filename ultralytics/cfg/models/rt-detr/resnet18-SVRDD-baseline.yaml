# Standard RT-DETR-ResNet18 architecture for the seven-class SVRDD dataset.
# Keep the neck and P3/P4/P5 decoder identical to rtdetr-resnet18.yaml.
nc: 7
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, ConvNormLayer, [32, 3, 2, 1, 'relu']]
  - [-1, 1, ConvNormLayer, [32, 3, 1, 1, 'relu']]
  - [-1, 1, ConvNormLayer, [64, 3, 1, 1, 'relu']]
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]]
  - [-1, 2, Blocks, [64, BasicBlock, 2, False]]
  - [-1, 2, Blocks, [128, BasicBlock, 3, False]]
  - [-1, 2, Blocks, [256, BasicBlock, 4, False]]
  - [-1, 2, Blocks, [512, BasicBlock, 5, False]]

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]
  - [-1, 1, AIFI, [1024, 8]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [5, 1, Conv, [256, 1, 1, None, 1, 1, False]]
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 15], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]
  - [[19, 22, 25], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]
