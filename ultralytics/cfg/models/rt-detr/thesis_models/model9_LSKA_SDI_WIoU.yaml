# Model 9: RT-DETR-ResNet18 改进版
# 改进点: 1.LSKA大核空间注意力(Neck) 2.SDI语义差异交互 3.WIoU损失函数
# 适用于道路缺陷检测 - 大感受野方案

# Parameters
nc: 80  # number of classes
scales:
  # [depth, width, max_channels]
  l: [1.00, 1.00, 1024]

# 自定义损失函数设置
loss_type: 'WIoU'  # 使用WIoU损失

backbone:
  # [from, repeats, module, args]
  - [-1, 1, ConvNormLayer, [32, 3, 2, 1, 'relu']] # 0-P1
  - [-1, 1, ConvNormLayer, [32, 3, 1, 1, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, 1, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2

  - [-1, 2, Blocks, [64,  BasicBlock, 2, False]] # 4
  - [-1, 2, Blocks, [128, BasicBlock, 3, False]] # 5-P3
  - [-1, 2, Blocks, [256, BasicBlock, 4, False]] # 6-P4
  - [-1, 2, Blocks, [512, BasicBlock, 5, False]] # 7-P5

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 8 input_proj.2
  - [-1, 1, AIFI, [1024, 8]]  # 9
  - [-1, 1, Conv, [256, 1, 1]]  # 10, Y5
  # 改进1: LSKA注意力
  - [-1, 1, LSKA, []] # 11

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 12
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 13 input_proj.1
  - [[-2, -1], 1, Concat, [1]]  # 14
  - [-1, 3, RepC3, [256, 0.5]]  # 15, fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]]  # 16, Y4
  - [-1, 1, LSKA, []] # 17

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 18
  - [5, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 19 input_proj.0
  - [[-2, -1], 1, Concat, [1]]  # 20 cat backbone P4
  - [-1, 3, RepC3, [256, 0.5]]  # 21, fpn_blocks.1 (P3)
  - [-1, 1, LSKA, []] # 22

  - [-1, 1, Conv, [256, 3, 2]]  # 23, downsample_convs.0
  - [[-1, 17], 1, Concat, [1]]  # 24 cat Y4
  - [-1, 3, RepC3, [256, 0.5]]  # 25, pan_blocks.0 (P4)

  - [-1, 1, Conv, [256, 3, 2]]  # 26, downsample_convs.1
  - [[-1, 11], 1, Concat, [1]]  # 27 cat Y5
  - [-1, 3, RepC3, [256, 0.5]]  # 28, pan_blocks.1 (P5)

  # 改进2: SDI语义差异交互
  - [[22, 25, 28], 1, SDI, [[256, 256, 256]]]  # 29 SDI融合

  - [[29, 25, 28], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # Detect(P3, P4, P5)


