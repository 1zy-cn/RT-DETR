# Model 4: RT-DETR-ResNet18 改进版
# 改进点: 1.MLCA混合局部通道注意力(Neck) 2.HSFPN语义特征金字塔 3.EIoU损失函数
# 适用于道路缺陷检测

# Parameters
nc: 80  # number of classes
scales:
  # [depth, width, max_channels]
  l: [1.00, 1.00, 1024]

# 自定义损失函数设置
loss_type: 'EIoU'  # 使用EIoU损失

backbone:
  # [from, repeats, module, args]
  - [-1, 1, ConvNormLayer, [32, 3, 2, 1, 'relu']] # 0-P1
  - [-1, 1, ConvNormLayer, [32, 3, 1, 1, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, 1, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2

  - [-1, 2, Blocks, [64,  BasicBlock, 2, False]] # 4
  - [-1, 2, Blocks, [128, BasicBlock, 3, False]] # 5-P3
  - [-1, 2, Blocks, [256, BasicBlock, 4, False]] # 6-P4
  - [-1, 2, Blocks, [512, BasicBlock, 5, False]] # 7-P5

head:
  # 改进2: HSFPN语义特征金字塔
  - [-1, 1, GSConv, [256, 1, 1, None, 1, 1, False]]  # 8 input_proj.2
  - [-1, 1, AIFI, [1024, 8]]
  - [-1, 1, CA, []] # 10
  - [-1, 1, nn.Conv2d, [256, 1]] # 11
  - [-1, 3, RepC3, [256, 0.5]] # 12 P5
  # 改进1: MLCA
  - [-1, 1, MLCA, []] # 13

  - [6, 1, CA, []]  # 14
  - [-1, 1, nn.Conv2d, [256, 1]]  # 15

  - [11, 1, nn.ConvTranspose2d, [256, 3, 2, 1, 1]] # 16
  - [-1, 1, CA, [4, False]]  # 17
  - [[-1, 15], 1, multiply, []] # 18
  - [[-1, 16], 1, Add, []] # 19
  - [-1, 3, RepC3, [256, 0.5]] # 20 P4
  - [-1, 1, MLCA, []] # 21

  - [5, 1, CA, []] # 22
  - [-1, 1, nn.Conv2d, [256, 1]] # 23

  - [16, 1, nn.ConvTranspose2d, [256, 3, 2, 1, 1]] # 24
  - [-1, 1, CA, [4, False]] # 25
  - [[-1, 23], 1, multiply, []] # 26
  - [[-1, 24], 1, Add, []] # 27
  - [-1, 3, RepC3, [256, 0.5]] # 28 P3
  - [-1, 1, MLCA, []] # 29

  - [[29, 21, 13], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # Detect(P3, P4, P5)


