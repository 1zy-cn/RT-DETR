# Model 5: RT-DETR-ResNet18 改进版
# 改进点: 1.EMA注意力机制(Backbone) 2.DCNv2可变形卷积 3.BiFPN双向特征融合
# 适用于道路缺陷检测 - 针对不规则形状缺陷

# Parameters
nc: 80  # number of classes
scales:
  # [depth, width, max_channels]
  l: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, ConvNormLayer, [32, 3, 2, 1, 'relu']] # 0-P1
  - [-1, 1, ConvNormLayer, [32, 3, 1, 1, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, 1, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2

  # 改进1: EMA注意力
  - [-1, 2, Blocks, [64,  BasicBlock_EMA, 2, True]] # 4
  - [-1, 2, Blocks, [128, BasicBlock_EMA, 3, True]] # 5-P3
  - [-1, 2, Blocks, [256, BasicBlock_EMA, 4, True]] # 6-P4
  - [-1, 2, Blocks, [512, BasicBlock_EMA, 5, True]] # 7-P5

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 8 input_proj.2
  - [-1, 1, AIFI, [1024, 8]]  # 9

  # 特征投影
  - [5, 1, Conv, [256]]  # 10-P3/8
  - [6, 1, Conv, [256]]  # 11-P4/16
  - [9, 1, Conv, [256]]  # 12-P5/32

  # 改进3: BiFPN自顶向下路径
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 13 P5->P4
  - [[-1, 11], 1, Bi_FPN, []] # 14
  # 改进2: DCNv2可变形卷积
  - [-1, 1, DCNv2, [256]] # 15
  - [-1, 3, RepC3, [256, 0.5]] # 16-P4/16

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 17 P4->P3
  - [[-1, 10], 1, Bi_FPN, []] # 18
  - [-1, 1, DCNv2, [256]] # 19
  - [-1, 3, RepC3, [256, 0.5]] # 20-P3/8

  # BiFPN自底向上路径
  - [-1, 1, Conv, [256, 3, 2]] # 21 P3->P4
  - [[-1, 11, 16], 1, Bi_FPN, []] # 22
  - [-1, 1, DCNv2, [256]] # 23
  - [-1, 3, RepC3, [256, 0.5]] # 24-P4/16

  - [-1, 1, Conv, [256, 3, 2]] # 25 P4->P5
  - [[-1, 12], 1, Bi_FPN, []] # 26
  - [-1, 3, RepC3, [256, 0.5]] # 27-P5/32

  - [[20, 24, 27], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # Detect(P3, P4, P5)


