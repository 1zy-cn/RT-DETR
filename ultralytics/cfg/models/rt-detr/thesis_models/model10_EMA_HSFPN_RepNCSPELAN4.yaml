# Model 10: RT-DETR-ResNet18 改进版
# 改进点: 1.EMA注意力机制(Backbone) 2.HSFPN语义特征金字塔 3.RepNCSPELAN4高效特征提取
# 适用于道路缺陷检测 - 综合增强方案

# Parameters
nc: 80  # number of classes
scales:
  # [depth, width, max_channels]
  l: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, ConvNormLayer, [32, 3, 2, 1, 'relu']] # 0-P1
  - [-1, 1, ConvNormLayer, [32, 3, 1, 1, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, 1, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2

  # 改进1: EMA注意力
  - [-1, 2, Blocks, [64,  BasicBlock_EMA, 2, True]] # 4
  - [-1, 2, Blocks, [128, BasicBlock_EMA, 3, True]] # 5-P3
  - [-1, 2, Blocks, [256, BasicBlock_EMA, 4, True]] # 6-P4
  - [-1, 2, Blocks, [512, BasicBlock_EMA, 5, True]] # 7-P5

head:
  # 改进2: HSFPN语义特征金字塔
  - [-1, 1, GSConv, [256, 1, 1, None, 1, 1, False]]  # 8 input_proj.2
  - [-1, 1, AIFI, [1024, 8]]
  - [-1, 1, CA, []] # 10
  - [-1, 1, nn.Conv2d, [256, 1]] # 11
  # 改进3: RepNCSPELAN4
  - [-1, 1, RepNCSPELAN4, [256, 1]] # 12 P5

  - [6, 1, CA, []]  # 13
  - [-1, 1, nn.Conv2d, [256, 1]]  # 14

  - [11, 1, nn.ConvTranspose2d, [256, 3, 2, 1, 1]] # 15
  - [-1, 1, CA, [4, False]]  # 16
  - [[-1, 14], 1, multiply, []] # 17
  - [[-1, 15], 1, Add, []] # 18
  - [-1, 1, RepNCSPELAN4, [256, 1]] # 19 P4

  - [5, 1, CA, []] # 20
  - [-1, 1, nn.Conv2d, [256, 1]] # 21

  - [15, 1, nn.ConvTranspose2d, [256, 3, 2, 1, 1]] # 22
  - [-1, 1, CA, [4, False]] # 23
  - [[-1, 21], 1, multiply, []] # 24
  - [[-1, 22], 1, Add, []] # 25
  - [-1, 1, RepNCSPELAN4, [256, 1]] # 26 P3

  - [[26, 19, 12], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # Detect(P3, P4, P5)

