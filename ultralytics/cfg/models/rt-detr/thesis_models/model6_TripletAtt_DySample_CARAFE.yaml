# Model 6: RT-DETR-ResNet18 改进版
# 改进点: 1.TripletAttention三重注意力(Backbone) 2.DySample动态上采样 3.CARAFE内容感知上采样
# 适用于道路缺陷检测 - 增强细节特征

# Parameters
nc: 80  # number of classes
scales:
  # [depth, width, max_channels]
  l: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, ConvNormLayer, [32, 3, 2, 1, 'relu']] # 0-P1
  - [-1, 1, ConvNormLayer, [32, 3, 1, 1, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, 1, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2

  # 改进1: TripletAttention三重注意力
  - [-1, 2, Blocks, [64,  BasicBlock_TripletAttention, 2, True]] # 4
  - [-1, 2, Blocks, [128, BasicBlock_TripletAttention, 3, True]] # 5-P3
  - [-1, 2, Blocks, [256, BasicBlock_TripletAttention, 4, True]] # 6-P4
  - [-1, 2, Blocks, [512, BasicBlock_TripletAttention, 5, True]] # 7-P5

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 8 input_proj.2
  - [-1, 1, AIFI, [1024, 8]]  # 9
  - [-1, 1, Conv, [256, 1, 1]]  # 10, Y5

  # 改进2 & 3: DySample + CARAFE混合上采样策略
  - [-1, 1, CARAFE, [2]] # 11 CARAFE上采样
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 12 input_proj.1
  - [[-2, -1], 1, Concat, [1]]  # 13
  - [-1, 3, RepC3, [256, 0.5]]  # 14, fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]]  # 15, Y4

  - [-1, 1, Dy_Sample, [2]] # 16 DySample上采样
  - [5, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 17 input_proj.0
  - [[-2, -1], 1, Concat, [1]]  # 18 cat backbone P4
  - [-1, 3, RepC3, [256, 0.5]]  # 19, fpn_blocks.1 (P3)

  - [-1, 1, Conv, [256, 3, 2]]  # 20, downsample_convs.0
  - [[-1, 15], 1, Concat, [1]]  # 21 cat Y4
  - [-1, 3, RepC3, [256, 0.5]]  # 22, pan_blocks.0 (P4)

  - [-1, 1, Conv, [256, 3, 2]]  # 23, downsample_convs.1
  - [[-1, 10], 1, Concat, [1]]  # 24 cat Y5
  - [-1, 3, RepC3, [256, 0.5]]  # 25, pan_blocks.1 (P5)

  - [[19, 22, 25], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # Detect(P3, P4, P5)


