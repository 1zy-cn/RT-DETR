# Ultralytics YOLO 🚀, AGPL-3.0 license
# RT-DETR-l object detection model with P3-P5 outputs. For details see https://docs.ultralytics.com/models/rtdetr

# Parameters
nc: 80  # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n-cls.yaml' will call yolov8-cls.yaml with scale 'n'
  # [depth, width, max_channels]
  l: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, ConvNormLayer, [32, 3, 2, 1, 'relu']] # 0-P1
  - [-1, 1, ConvNormLayer, [32, 3, 1, 1, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, 1, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2

  # Blocks args: [channels, block, stage, att]. Enable SCSA in all 8 residual blocks.
  - [-1, 2, Blocks, [64,  BasicBlock_SCSA, 2, True]] # 4
  - [-1, 2, Blocks, [128, BasicBlock_SCSA, 3, True]] # 5-P3
  - [-1, 2, Blocks, [256, BasicBlock_SCSA, 4, True]] # 6-P4
  - [-1, 2, Blocks, [512, BasicBlock_SCSA, 5, True]] # 7-P5

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 8 input_proj.2
  - [-1, 1, AIFI, [1024, 8]]
  - [-1, 1, Conv, [256, 1, 1]]  # 10, Y5, lateral_convs.0

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 11
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 12 input_proj.1
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]  # 14, fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]]  # 15, Y4, lateral_convs.1

  # P3-only FreqFusion: full low/high-pass and offset branches, fixed torch backend.
  - [5, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 16 C3 projection (HR)
  - [[16, 15], 1, FreqFusionConcat, [64]]  # 17 [P4 upsampled, enhanced C3], 512 channels
  - [-1, 3, RepC3, [256, 0.5]]  # 18 P3

  # Preserve the baseline bottom-up path.
  - [-1, 1, Conv, [256, 3, 2]]  # 19
  - [[-1, 15], 1, Concat, [1]]  # 20
  - [-1, 3, RepC3, [256, 0.5]]  # 21 P4

  - [-1, 1, Conv, [256, 3, 2]]  # 22
  - [[-1, 10], 1, Concat, [1]]  # 23
  - [-1, 3, RepC3, [256, 0.5]]  # 24 P5

  - [[18, 21, 24], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]
